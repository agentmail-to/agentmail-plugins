interface:
  display_name: "AgentID Accounts"
  short_description: "Create accounts at apps for your agent"
  default_prompt: "Use $agentid to create an account for my agent at an app, such as Firecrawl."
dependencies:
  tools:
    - type: "mcp"
      value: "agentmail"
      description: "AgentMail hosted MCP server"
      transport: "streamable_http"
      url: "https://mcp.agentmail.to/mcp"
policy:
  allow_implicit_invocation: true
