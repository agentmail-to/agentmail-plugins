name: Validate marketplaces

on:
  pull_request:
    paths:
      - .agents/**
      - .claude-plugin/**
      - .codex-plugin/**
      - .cursor-plugin/**
      - .plugin/**
      - .mcp.json
      - assets/**
      - skills/**
      - .github/workflows/marketplace.yml
  push:
    branches: [main]
    paths:
      - .agents/**
      - .claude-plugin/**
      - .codex-plugin/**
      - .cursor-plugin/**
      - .plugin/**
      - .mcp.json
      - assets/**
      - skills/**
      - .github/workflows/marketplace.yml
  schedule:
    - cron: "37 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Codex marketplace installation
        run: |
          npm install --global @openai/codex
          codex_home="$(mktemp -d)"
          CODEX_HOME="$codex_home" codex plugin marketplace add . --json
          CODEX_HOME="$codex_home" codex plugin list --available --json | tee /tmp/codex-plugins.json
          grep -q '"pluginId": "agentmail@agentmail"' /tmp/codex-plugins.json
          CODEX_HOME="$codex_home" codex plugin add agentmail@agentmail --json

      - name: Validate Claude plugin
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict

  canonical-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: agentmail-plugins

      - name: Checkout canonical skills
        uses: actions/checkout@v4
        with:
          repository: agentmail-to/agentmail-skills
          path: agentmail-skills

      - name: Checkout canonical MCP contract
        uses: actions/checkout@v4
        with:
          repository: agentmail-to/agentmail-mcp
          path: agentmail-mcp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check canonical skills against MCP
        working-directory: agentmail-skills
        run: python3 scripts/skills.py sync --check --backend ../agentmail-mcp

      - name: Check plugin skill export
        working-directory: agentmail-skills
        run: python3 scripts/skills.py build --check --target ../agentmail-plugins
