name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository structure
        run: python3 scripts/validate_repo.py

      - name: Test Cursor marketplace verifier
        run: python3 scripts/check_cursor_marketplace.py --self-test
