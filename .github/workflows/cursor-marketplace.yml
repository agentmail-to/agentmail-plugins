name: Verify Cursor marketplace

on:
  schedule:
    - cron: "27 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 scripts/check_cursor_marketplace.py --self-test
      - run: python3 scripts/check_cursor_marketplace.py
